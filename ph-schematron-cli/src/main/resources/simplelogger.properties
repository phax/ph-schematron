# Messages of the libraries used by the command line client: warnings and errors only, on stderr
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
# The RELAX NG validator of the command "check" does not know the JAXP security properties - harmless
org.slf4j.simpleLogger.log.com.helger.xml.EXMLParserProperty=error
